<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The icon set, built from public/brand/icon-master.png by `yarn icons`.
         The .ico is what Google's favicon fetcher looks for — an SVG alone is
         enough for browsers but leaves a blank globe beside the site name in
         search results. Regenerate whenever the logo changes. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E0E0E" />

    <!-- Webfonts are self-hosted: the @font-face rules are at the top of
         src/index.css and the files live in public/fonts. These preloads are
         the weights the first paint uses (body text, labels, headings), so the
         fallback-to-Barlow swap happens before anyone reads it. Keep them in
         step with src/index.css; the other weights load on demand.

         Google Fonts instead: set `googleFonts` in src/config/theme.config.js
         and vite.config.js injects the preconnect and stylesheet links. -->
    <link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/barlow-condensed-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- seo:fallback:start -->
    <!-- Fallback SEO for `vite dev`, where nothing prerenders and Helmet only
         catches up once the bundle runs. In a built document
         scripts/prerender.mjs replaces this whole block with the page's own
         Helmet output — leaving it in would put two <title> elements in one
         document. Keep the markers. -->
    <title>Australian Poker Calendar — Poker Schedule, Events &amp; News</title>
    <meta
      name="description"
      content="Australia's poker calendar: the full poker tournament schedule with every series and event, dates, venues and buy-ins, plus poker news, player rankings and promotions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Australian Poker Calendar" />
    <meta
      property="og:description"
      content="Australia's poker calendar: the full poker tournament schedule with every series and event, dates, venues and buy-ins, plus poker news, player rankings and promotions."
    />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Australian Poker Calendar" />
    <meta
      name="twitter:description"
      content="Australia's poker calendar: the full poker tournament schedule with every series and event, dates, venues and buy-ins, plus poker news, player rankings and promotions."
    />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <!-- seo:fallback:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
