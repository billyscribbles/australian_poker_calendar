# Monthly, grouped dependency PRs — keeps the template (and every client clone
# with Dependabot enabled) fresh without weekly noise. Majors arrive as their
# own PRs so breaking changes are reviewed deliberately.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 5

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
