<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Dashboard · Australian Poker Calendar</title>
    <link rel="icon" href="../brand/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand__mark">APC</span>
          <span class="brand__name">Dashboard</span>
        </div>
        <a class="site-link" id="site-link" href="/">← Back to website</a>
        <nav class="nav" id="nav" aria-label="Sections"></nav>
        <div class="sidebar__foot">
          <button type="button" class="btn btn--ghost" id="refresh">Refresh</button>
          <p class="meta" id="meta"></p>
          <form method="post" action="logout" id="logout" hidden>
            <button type="submit" class="btn btn--ghost btn--sm">Sign out</button>
          </form>
        </div>
      </aside>
      <main class="main" id="main" tabindex="-1">
        <p class="loading">Loading…</p>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
