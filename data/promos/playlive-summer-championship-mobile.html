<!doctype html>
<!-- Source for public/images/promos/playlive-summer-championship-mobile.webp (375×150, shipped at 2×).
     Re-render as the wide banner, with --window-size=375,150 -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Montserrat:wght@800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="_shared.css" />
    <style>
      html,
      body {
        width: 375px;
        height: 150px;
      }
      .banner {
        width: 375px;
        height: 150px;
        background-position: 50% 28%;
      }
      .logo {
        position: absolute;
        left: 12px;
        top: 10px;
      }
      .logo img {
        height: 34px;
      }
      .lockup {
        left: 82px;
        top: 34px;
        width: 210px;
      }
      .lockup img {
        width: 100%;
        height: auto;
        display: block;
      }
      .gtd {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 21px;
      }
      .dates {
        position: absolute;
        right: 12px;
        bottom: 10px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="wash"></div>
      <div class="tint"></div>
      <div class="logo"><img src="../../public/images/tours/playlive.png" alt="" /></div>
      <div class="lockup"><img src="assets/summer-championship-lockup.png" alt="" /></div>
      <div class="gtd">$3,000,000 GTD</div>
      <div class="dates">Nov 26<sup>th</sup> - Dec 15<sup>th</sup></div>
    </div>
  </body>
</html>
